services:
  actual:
    image: actualbudget/actual-server:${ACTUAL_TAG:-latest}
    container_name: actual-budget
    restart: unless-stopped
    ports:
      - "${ACTUAL_PORT:-5006}:5006"
    volumes:
      - ./data:/data
      # Active HTTPS (chemins des certificats ci-dessous)
      - ./config.json:/data/config.json:ro
      # cert.pem + key.pem générés avec mkcert (docs/https-local.md)
      - ./ssl:/ssl:ro
    environment:
      TZ: ${TZ:-Europe/Paris}
