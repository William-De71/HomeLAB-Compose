services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:${MEALIE_TAG:-latest}
    container_name: mealie
    restart: unless-stopped
    ports:
      - "${MEALIE_PORT:-9925}:9000"
    volumes:
      - ./data:/app/data
    environment:
      TZ: ${TZ:-Europe/Paris}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      BASE_URL: ${BASE_URL:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
