services:
  joplin:
    image: joplin/server:${JOPLIN_TAG:-latest}
    container_name: joplin
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${JOPLIN_PORT:-22300}:22300"
    environment:
      TZ: ${TZ:-Europe/Paris}
      APP_PORT: "22300"
      # URL exacte utilisée par les clients Joplin (avec le port)
      APP_BASE_URL: ${APP_BASE_URL:?definissez APP_BASE_URL dans .env}
      DB_CLIENT: pg
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definissez DB_PASSWORD dans .env}

  db:
    image: postgres:${POSTGRES_TAG:-16-alpine}
    container_name: joplin-db
    restart: unless-stopped
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: joplin
      POSTGRES_USER: joplin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definissez DB_PASSWORD dans .env}

  # Dump quotidien de la base dans ./data/dumps, lu par Kopia (infra/kopia).
  # Restauration : voir README.
  db-dump:
    image: postgres:${POSTGRES_TAG:-16-alpine}
    container_name: joplin-db-dump
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./data/dumps:/dumps
    environment:
      PGHOST: db
      PGUSER: joplin
      PGDATABASE: joplin
      PGPASSWORD: ${DB_PASSWORD:?definissez DB_PASSWORD dans .env}
      KEEP_DAYS: ${DUMP_KEEP_DAYS:-7}
    entrypoint:
      - sh
      - -c
      - |
        sleep 60
        while true; do
          f=/dumps/joplin-$$(date +%F).dump
          if pg_dump -Fc -f "$$f.tmp" && mv "$$f.tmp" "$$f"; then
            echo "dump OK : $$f"
            find /dumps -name '*.dump' -mtime +$$KEEP_DAYS -delete
            sleep 86400
          else
            echo "échec du dump, nouvel essai dans 1 h"
            rm -f "$$f.tmp"
            sleep 3600
          fi
        done
