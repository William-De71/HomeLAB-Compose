services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:${PAPERLESS_TAG:-latest}
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "${PAPERLESS_PORT:-8000}:8000"
    volumes:
      - ./data/data:/usr/src/paperless/data
      - ./data/media:/usr/src/paperless/media
      - ./data/export:/usr/src/paperless/export
      # Dossier surveillé : tout fichier déposé ici est importé
      - ${CONSUME_DIR:-./data/consume}:/usr/src/paperless/consume
    environment:
      PAPERLESS_TIME_ZONE: ${TZ:-Europe/Paris}
      PAPERLESS_URL: ${PAPERLESS_URL:-}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?definissez PAPERLESS_SECRET_KEY dans .env}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?definissez PAPERLESS_ADMIN_PASSWORD dans .env}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-fra}
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPASS: ${DB_PASSWORD:?definissez DB_PASSWORD dans .env}
      USERMAP_UID: ${PUID:-1000}
      USERMAP_GID: ${PGID:-1000}

  db:
    image: postgres:${POSTGRES_TAG:-16-alpine}
    container_name: paperless-db
    restart: unless-stopped
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definissez DB_PASSWORD dans .env}

  # Dump quotidien de la base dans ./data/dumps, lu par Kopia (infra/kopia).
  # Restauration : voir README.
  db-dump:
    image: postgres:${POSTGRES_TAG:-16-alpine}
    container_name: paperless-db-dump
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./data/dumps:/dumps
    environment:
      PGHOST: db
      PGUSER: paperless
      PGDATABASE: paperless
      PGPASSWORD: ${DB_PASSWORD:?definissez DB_PASSWORD dans .env}
      KEEP_DAYS: ${DUMP_KEEP_DAYS:-7}
    entrypoint:
      - sh
      - -c
      - |
        sleep 60
        while true; do
          f=/dumps/paperless-$$(date +%F).dump
          if pg_dump -Fc -f "$$f.tmp" && mv "$$f.tmp" "$$f"; then
            echo "dump OK : $$f"
            find /dumps -name '*.dump' -mtime +$$KEEP_DAYS -delete
            sleep 86400
          else
            echo "échec du dump, nouvel essai dans 1 h"
            rm -f "$$f.tmp"
            sleep 3600
          fi
        done

  broker:
    image: redis:${REDIS_TAG:-7-alpine}
    container_name: paperless-redis
    restart: unless-stopped
