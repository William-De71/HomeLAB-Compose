services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:${FRIGATE_TAG:-stable}
    container_name: frigate
    restart: unless-stopped
    stop_grace_period: 30s
    # Augmenter avec le nombre et la résolution des caméras
    shm_size: ${FRIGATE_SHM_SIZE:-512mb}
    # Accélération : décommenter ce qui correspond au matériel
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb               # Coral USB
    #   - /dev/apex_0:/dev/apex_0                 # Coral PCIe / M.2
    #   - /dev/dri/renderD128:/dev/dri/renderD128 # GPU Intel / AMD
    ports:
      - "${FRIGATE_PORT:-8971}:8971"
      - "8554:8554"     # flux RTSP restreamés
      - "8555:8555/tcp" # WebRTC
      - "8555:8555/udp" # WebRTC
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ${FRIGATE_MEDIA:-./data/media}:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    environment:
      TZ: ${TZ:-Europe/Paris}
      # Utilisable dans config.yml sous la forme {FRIGATE_RTSP_PASSWORD}
      FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD:-}
