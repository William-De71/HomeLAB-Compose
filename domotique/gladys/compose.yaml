services:
  gladys:
    image: gladysassistant/gladys:${GLADYS_TAG:-v4}
    container_name: gladys
    restart: unless-stopped
    privileged: true
    network_mode: host
    cgroup: host
    environment:
      NODE_ENV: production
      SQLITE_FILE_PATH: /var/lib/gladysassistant/gladys-production.db
      SERVER_PORT: ${SERVER_PORT:-80}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Chemin identique côté hôte et conteneur : Gladys lance lui-même des
      # conteneurs (Zigbee2MQTT, Mosquitto…) qui montent ces mêmes dossiers.
      - /var/lib/gladysassistant:/var/lib/gladysassistant
      - /dev:/dev
      - /run/udev:/run/udev:ro
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Met à jour Gladys automatiquement. --label-enable : ne touche qu'aux
  # conteneurs labellisés, pas au reste du homelab.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    command: --cleanup --include-restarting --label-enable
    environment:
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
