services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:${HA_TAG:-stable}
    container_name: homeassistant
    restart: unless-stopped
    privileged: true
    network_mode: host  # découverte mDNS / SSDP / Matter
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro  # Bluetooth
    environment:
      TZ: ${TZ:-Europe/Paris}
