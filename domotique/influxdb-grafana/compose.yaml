services:
  influxdb:
    image: influxdb:${INFLUXDB_TAG:-2}
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - ./data/influxdb:/var/lib/influxdb2
      - ./data/influxdb-config:/etc/influxdb2
    environment:
      TZ: ${TZ:-Europe/Paris}
      # Initialisation au premier lancement uniquement
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?definissez INFLUXDB_PASSWORD dans .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-homelab}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-home_assistant}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-0}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?definissez INFLUXDB_TOKEN dans .env}

  grafana:
    image: grafana/grafana:${GRAFANA_TAG:-latest}
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # Source de données InfluxDB déclarée automatiquement
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      TZ: ${TZ:-Europe/Paris}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?definissez GRAFANA_PASSWORD dans .env}
      # Lus par grafana/provisioning/datasources/influxdb.yaml
      INFLUXDB_ORG: ${INFLUXDB_ORG:-homelab}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-home_assistant}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?definissez INFLUXDB_TOKEN dans .env}

volumes:
  grafana-data:
