services:
  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_TAG:-2}
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./config:/mosquitto/config
      - ./data:/mosquitto/data
    environment:
      TZ: ${TZ:-Europe/Paris}
