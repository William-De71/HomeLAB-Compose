services:
  zwave-js-ui:
    image: zwavejs/zwave-js-ui:${ZWAVE_TAG:-latest}
    container_name: zwave-js-ui
    restart: unless-stopped
    tty: true
    stop_signal: SIGINT
    depends_on:
      - mosquitto
    ports:
      - "${ZWAVE_UI_PORT:-8091}:8091"  # interface web
      - "${ZWAVE_WS_PORT:-3000}:3000"  # serveur Z-Wave JS (Home Assistant)
    volumes:
      - ./store:/usr/src/app/store
    devices:
      # Clé Z-Wave : préférer le chemin stable /dev/serial/by-id/…
      - ${ZWAVE_DEVICE:?definissez ZWAVE_DEVICE dans .env}:/dev/zwave
    environment:
      TZ: ${TZ:-Europe/Paris}
      SESSION_SECRET: ${SESSION_SECRET:?definissez SESSION_SECRET dans .env}
      ZWAVEJS_EXTERNAL_CONFIG: /usr/src/app/store/.config-db

  # Broker dédié à cette stack. Pour utiliser un broker existant : supprimer ce
  # service et le depends_on, puis renseigner son adresse dans Réglages → MQTT.
  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_TAG:-2}
    container_name: zwave-js-ui-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
    environment:
      TZ: ${TZ:-Europe/Paris}
