services:
  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_TAG:-latest}
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "${VAULTWARDEN_PORT:-8222}:80"
    volumes:
      - ./data:/data
      # cert.pem + key.pem générés avec mkcert (docs/https-local.md)
      - ./ssl:/ssl:ro
    environment:
      TZ: ${TZ:-Europe/Paris}
      # HTTPS servi directement par Vaultwarden, sans reverse proxy
      ROCKET_TLS: '{certs="/ssl/cert.pem",key="/ssl/key.pem"}'
      # Adresse HTTPS d'accès, avec le port
      DOMAIN: ${DOMAIN:?definissez DOMAIN dans .env}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-true}
      # Page /admin désactivée si vide
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
