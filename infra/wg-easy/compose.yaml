# Source : https://github.com/wg-easy/wg-easy/blob/master/docker-compose.yml
services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:${WG_EASY_TAG:-15}
    container_name: wg-easy
    restart: unless-stopped
    networks:
      wg:
        ipv4_address: 10.42.42.42
        ipv6_address: fdcc:ad94:bacf:61a3::2a
    ports:
      - "${WG_PORT:-51820}:51820/udp"
      - "${WG_UI_PORT:-51821}:51821/tcp"
    volumes:
      - ./data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    environment:
      TZ: ${TZ:-Europe/Paris}
      # true tant que l'interface est ouverte en HTTP sur le réseau local
      INSECURE: ${WG_UI_INSECURE:-true}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.42.42.0/24
        - subnet: fdcc:ad94:bacf:61a3::/64
