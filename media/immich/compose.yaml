# Source : https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
# Toujours vérifier les notes de version avant de changer IMMICH_VERSION.
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich-server
    restart: unless-stopped
    depends_on:
      - redis
      - database
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    volumes:
      - ${UPLOAD_LOCATION:-./data/library}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    healthcheck:
      disable: false

  immich-machine-learning:
    # Accélération : suffixer le tag (-openvino, -cuda…), voir README
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich-machine-learning
    restart: unless-stopped
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    healthcheck:
      disable: false

  redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    container_name: immich-redis
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-db
    restart: unless-stopped
    shm_size: 128mb
    volumes:
      - ${DB_DATA_LOCATION:-./data/db}:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?definissez DB_PASSWORD dans .env}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Décommenter si la base n'est pas sur un SSD
      # DB_STORAGE_TYPE: "HDD"
    healthcheck:
      disable: false

volumes:
  model-cache:
