# Source : https://github.com/William-De71/Kalendra
services:
  kalendra:
    image: ghcr.io/william-de71/kalendra:${KALENDRA_TAG:-1}
    container_name: kalendra
    restart: unless-stopped
    ports:
      - "${KALENDRA_PORT:-5232}:5232"
    volumes:
      - kalendra-data:/data
    environment:
      # Compte administrateur créé au tout premier démarrage uniquement.
      KALENDRA_ADMIN_USER: "${KALENDRA_ADMIN_USER:-admin}"
      KALENDRA_ADMIN_PASSWORD: "${KALENDRA_ADMIN_PASSWORD:?definissez KALENDRA_ADMIN_PASSWORD dans .env}"
      KALENDRA_LOG_LEVEL: "info"
      KALENDRA_TRUST_PROXY: "${KALENDRA_TRUST_PROXY:-false}"
      KALENDRA_QUOTA_BYTES: "${KALENDRA_QUOTA_BYTES:-0}"
      KALENDRA_BACKUP_DIR: "${KALENDRA_BACKUP_DIR:-}"
      KALENDRA_METRICS: "${KALENDRA_METRICS:-false}"
      KALENDRA_METRICS_TOKEN: "${KALENDRA_METRICS_TOKEN:-}"
      TZ: "${TZ:-Europe/Paris}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5232/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  kalendra-data:
